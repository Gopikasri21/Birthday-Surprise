<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Last Surprise 🎁</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:linear-gradient(135deg,#ffd6e8,#e1f5ff);
    overflow:hidden;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.gift{
    font-size:100px;
    cursor:pointer;
    animation:shake 1s infinite;
}

@keyframes shake{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(-8deg);}
    75%{transform:rotate(8deg);}
}

h1{
    color:#ff4081;
}

#message{
    display:none;
    background:white;
    padding:35px;
    max-width:600px;
    border-radius:25px;
    box-shadow:0 10px 30px #0002;
    font-size:19px;
    line-height:1.8;
}

.confetti{
    position:fixed;
    top:-20px;
    font-size:25px;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="gift" onclick="openGift()">🎁</div>

<h1>One Last Surprise!</h1>

<p>Click the gift 🎁</p>

<div id="message">

<h2>🥹❤️ Happy Birthday Appukutty❤️🥹</h2>

<p>
Evlo sandai vandhalum,
evlo torture pannalum 😂,
nee alway ennaku special dhaan.
</p>

<p>
I hope this year brings you
lots of happiness, success and beautiful memories. ✨
</p>

<h2>🎂 HAPPY BIRTHDAY EN AASA THAMBI! 🥳</h2>

<p>Always keep smiling! ❤️🫶</p>

</div>

</div>

<script>

function openGift(){

    document.getElementById("message").style.display="block";

    for(let i=0;i<70;i++){

        let confetti=document.createElement("div");

        confetti.className="confetti";
        confetti.innerHTML=["🎉","🎊","❤️","✨","🎂"][Math.floor(Math.random()*5)];

        confetti.style.left=Math.random()*100+"vw";
        confetti.style.animationDuration=(2+Math.random()*3)+"s";

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);
    }
}

</script>

</body>
</html>
