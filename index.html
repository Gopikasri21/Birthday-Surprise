<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Thangapulla🎂</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:linear-gradient(135deg,#ffd6e8,#d9f1ff);
    color:#333;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.cake{
    font-size:90px;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    50%{transform:translateY(-15px);}
}

h1{
    color:#ff4081;
    font-size:45px;
}

p{
    font-size:20px;
}

button{
    background:#ff4081;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday Thangapulla! 🥳</h1>

    <p>Special day is celebrating today! ❤️</p>

    <button onclick="location.href='message.html'">
        Open Your Surprise 🎁
    </button>

</div>

</body>
</html>
